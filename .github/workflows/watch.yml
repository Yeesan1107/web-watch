name: Website Watch
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_line:
        description: "Send a LINE test notification"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check websites
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          LINE_GROUPS_URL: ${{ secrets.LINE_GROUPS_URL }}
          LINE_GROUPS_API_KEY: ${{ secrets.LINE_GROUPS_API_KEY }}
          LINE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_line && 'true' || 'false' }}
        run: python watch.py
      - name: Check job postings
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          LINE_GROUPS_URL: ${{ secrets.LINE_GROUPS_URL }}
          LINE_GROUPS_API_KEY: ${{ secrets.LINE_GROUPS_API_KEY }}
        run: python jobs_watch.py
      - name: Save monitor state
        run: |
          if { [ -f state.json ] && ! git diff --quiet -- state.json; } || { [ -f jobs_state.json ] && ! git diff --quiet -- jobs_state.json; }; then
            git config user.name "web-watch-bot"
            git config user.email "web-watch-bot@users.noreply.github.com"
            git add state.json jobs_state.json 2>/dev/null || true
            git commit -m "chore: update website watch state"
            git push
          elif [ -f state.json ] && [ -z "$(git ls-files state.json)" ]; then
            git config user.name "web-watch-bot"
            git config user.email "web-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: initialize website watch state"
            git push
          fi
